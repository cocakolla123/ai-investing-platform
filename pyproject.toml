[project]
name = "dynamo"
version = "0.1.0"
description = "Personal AI investing platform: Claude research committee + quant models + risk-first portfolio management"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "anthropic>=0.116",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "httpx>=0.27",
    "pandas>=2.2,<3",  # repo is validated on the 2.x line; 3.x needs its own pass
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "statsforecast>=1.7",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "alpaca-py>=0.21",
    "exchange-calendars>=4.5",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "streamlit>=1.35",
    "tenacity>=8.3",
    # Conformal probability calibration (sklearn-family, lightweight).
    "mapie>=1.0",
    "cryptography>=50.0.0",
]

[tool.uv]
# Keep the universal resolution on the versions the repo is validated against:
# without these floors, adding the transcripts/analysis extras makes uv
# backtrack numpy/scipy/statsforecast to older releases (numba path) that
# change the numpy type stubs pyright checks against.
constraint-dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "statsforecast>=2.1.1",
    "alphalens-reloaded>=0.4.6",
]

[project.optional-dependencies]
# Heavy: pulls torch. Only needed for journal embeddings (learning loop);
# the EmbeddingModel port has a hash-based fallback when absent.
embeddings = ["sentence-transformers>=3.0"]
# Bulk earnings-call transcripts via defeatbeta-api (pulls duckdb/huggingface
# datasets machinery). The adapter guards the import and skips when absent.
# <0.0.41: newer releases force pandas>=3 / pin duckdb, dragging the base
# environment off its locked pandas 2.x line during universal resolution.
transcripts = ["defeatbeta-api>=0.0.30,<0.0.41"]
# Tearsheets + factor audits (matplotlib/seaborn/statsmodels/yfinance chain).
# Both call sites guard the import and degrade to a logged no-op when absent.
analysis = ["quantstats>=0.0.62", "alphalens-reloaded>=0.4.3"]
# Live Polymarket CLOB execution (ADR-0012): pulls eth-account/web3 signing
# machinery, so it stays out of the base install. The broker guards the
# import and reports configured=False (sim fallback) when absent.
polymarket = ["py-clob-client>=0.34.6"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pyright>=1.1.370",
    "pre-commit>=3.7",
    "import-linter>=2.0",
    "vcrpy>=6.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamo"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF012: pydantic models deep-copy mutable defaults — safe by construction.
ignore = ["RUF012"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "orchestration"]
# Strict where correctness is money: domain contracts and risk math.
strict = ["src/dynamo/domain", "src/dynamo/risk"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_package = "dynamo"

# The one dependency rule (Clean-Architecture-lite):
# domain imports nothing from dynamo; core logic imports domain only;
# adapters implement domain ports; api/orchestration wire everything.
[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["dynamo.domain"]
forbidden_modules = [
    "dynamo.data", "dynamo.llm", "dynamo.persistence", "dynamo.execution",
    "dynamo.api", "dynamo.research", "dynamo.risk", "dynamo.portfolio",
    "dynamo.backtest", "dynamo.learning", "dynamo.observability", "dynamo.config",
    "dynamo.reporting",
]

[[tool.importlinter.contracts]]
name = "core logic does not import adapters"
type = "forbidden"
source_modules = ["dynamo.risk", "dynamo.portfolio", "dynamo.research", "dynamo.backtest", "dynamo.learning"]
forbidden_modules = ["dynamo.data", "dynamo.llm", "dynamo.persistence", "dynamo.execution", "dynamo.api", "dynamo.reporting"]
