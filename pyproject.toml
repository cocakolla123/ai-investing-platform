[project]
name = "dynamo"
version = "0.1.0"
description = "Personal AI investing platform: Claude research committee + quant models + risk-first portfolio management"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "anthropic>=0.116",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "statsforecast>=1.7",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "alpaca-py>=0.21",
    "exchange-calendars>=4.5",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "streamlit>=1.35",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# Heavy: pulls torch. Only needed for journal embeddings (learning loop);
# the EmbeddingModel port has a hash-based fallback when absent.
embeddings = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pyright>=1.1.370",
    "pre-commit>=3.7",
    "import-linter>=2.0",
    "vcrpy>=6.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamo"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF012: pydantic models deep-copy mutable defaults — safe by construction.
ignore = ["RUF012"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
# Strict where correctness is money: domain contracts and risk math.
strict = ["src/dynamo/domain", "src/dynamo/risk"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_package = "dynamo"

# The one dependency rule (Clean-Architecture-lite):
# domain imports nothing from dynamo; core logic imports domain only;
# adapters implement domain ports; api/orchestration wire everything.
[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["dynamo.domain"]
forbidden_modules = [
    "dynamo.data", "dynamo.llm", "dynamo.persistence", "dynamo.execution",
    "dynamo.api", "dynamo.research", "dynamo.risk", "dynamo.portfolio",
    "dynamo.backtest", "dynamo.learning", "dynamo.observability", "dynamo.config",
]

[[tool.importlinter.contracts]]
name = "core logic does not import adapters"
type = "forbidden"
source_modules = ["dynamo.risk", "dynamo.portfolio", "dynamo.research", "dynamo.backtest", "dynamo.learning"]
forbidden_modules = ["dynamo.data", "dynamo.llm", "dynamo.persistence", "dynamo.execution", "dynamo.api"]
