# PR pipeline — mirrors `make check` plus what needs services (doc 12 §3.1).
name: pr

on:
  pull_request:
  workflow_dispatch:

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: ruff check
        run: uv run ruff check src tests orchestration
      - name: ruff format --check
        run: uv run ruff format --check src tests orchestration

  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: import-linter (the dependency rule, doc 01 §2)
        run: uv run lint-imports

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: pyright (strict on domain + risk)
        run: uv run pyright

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: unit tests (incl. hypothesis risk suites)
        run: uv run pytest tests/unit -q

  integration-tests:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: dynamo
          POSTGRES_PASSWORD: dynamo-ci
          POSTGRES_DB: dynamo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dynamo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DB_URL: postgresql+psycopg://dynamo:dynamo-ci@localhost:5432/dynamo_test
      DATABASE_URL: postgresql+psycopg://dynamo:dynamo-ci@localhost:5432/dynamo_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: migrate (alembic, forward-only)
        run: uv run alembic upgrade head
      - name: integration tests (service container + cassettes, no live providers)
        run: uv run pytest tests/integration -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build project image (webserver/daemon/api/dashboard)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pip-audit:
    runs-on: ubuntu-latest
    # Advisory gate: warn on known vulns; flip to blocking for criticals (doc 12 §3.1).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: export locked requirements
        run: uv export --frozen --no-dev --format requirements-txt -o requirements-ci.txt
      - name: pip-audit (non-blocking)
        run: uvx pip-audit -r requirements-ci.txt
