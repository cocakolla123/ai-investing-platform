# Main pipeline — everything the PR gate runs, then image publish + deploy
# (doc 12 §3.2). Deploy is a documented placeholder until the host exists:
# the real step is `ssh host 'cd /opt/dynamo && docker compose pull && docker
# compose up -d'` followed by a health-endpoint smoke check; rollback is
# `docker compose up` with the previous sha tag.
name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check src tests orchestration
      - run: uv run ruff format --check src tests orchestration

  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run lint-imports

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pyright

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest tests/unit -q

  integration-tests:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: dynamo
          POSTGRES_PASSWORD: dynamo-ci
          POSTGRES_DB: dynamo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dynamo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DB_URL: postgresql+psycopg://dynamo:dynamo-ci@localhost:5432/dynamo_test
      DATABASE_URL: postgresql+psycopg://dynamo:dynamo-ci@localhost:5432/dynamo_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/integration -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.app
          push: false
          tags: dynamo-app:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pip-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv export --frozen --no-dev --format requirements-txt -o requirements-ci.txt
      - run: uvx pip-audit -r requirements-ci.txt

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, imports, typecheck, unit-tests, integration-tests, docker-build]
    steps:
      - name: deploy placeholder
        run: |
          echo "Deploy placeholder (doc 12 §3.2)."
          echo "When the host exists: push image to GHCR tagged sha-<short> + latest,"
          echo "then: ssh host 'cd /opt/dynamo && docker compose pull && docker compose up -d'"
          echo "followed by a health-endpoint smoke check. Rollback = previous sha tag."
